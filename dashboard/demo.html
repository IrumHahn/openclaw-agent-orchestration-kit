<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>범용 오케스트레이션 실습</title>
<style>
:root{font:16px system-ui,sans-serif;color:#eaf0fb;background:#101722}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:24px}h1{line-height:1.2}p{line-height:1.6;color:#bac9df}button{font:inherit;color:inherit;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button{border:1px solid #526b88;background:#24354b;border-radius:8px;padding:10px}.tabs button[aria-pressed=true]{background:#496f9d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{border:1px solid #41536d;background:#1b2737;border-radius:12px;padding:15px}.card h2{font-size:18px;margin:0 0 7px}.meta{color:#aebfd5;font-size:13px}.badge{display:inline-block;margin:10px 0;padding:4px 7px;border-radius:5px;background:#3b4555}.pass{background:#205843}.warn{background:#684d22}.stale{background:#6e3a3a}.gate{border:1px dashed #788ba7;padding:16px;border-radius:10px;margin-top:20px}code{word-break:break-all}a{color:#a9d0ff}@media(max-width:500px){main{padding:18px}}
</style></head><body><main><small>FICTIONAL DATA · READ-ONLY</small><h1>에이전트 오케스트레이션 실습</h1><p>같은 JSON에서 작업·검수·실행 흔적을 그립니다. 임시 자식 세션은 실행 기록이며, 작업의 최종 책임자나 QA 판정이 아닙니다. 실제 게시 없이 미리보기 통합까지만 진행합니다.</p><nav class="tabs" id="tabs" aria-label="시나리오 단계"></nav><p id="summary" role="status"></p><section id="tasks" class="grid" aria-label="작업"></section><section class="gate" id="gate"></section><h2>보존된 사건 이력</h2><ul id="history"></ul><p><a href="../examples/product-page/scenario.json">근거 JSON 열기</a></p><p>로컬 파일 열기에서는 fetch가 차단될 수 있습니다. 저장소 루트에서 <code>python3 -m http.server 8765</code> 후 <code>http://localhost:8765/dashboard/demo.html</code>로 접속하세요.</p></main>
<script type="module">
const tabs=document.querySelector('#tabs'),tasks=document.querySelector('#tasks'),summary=document.querySelector('#summary'),gate=document.querySelector('#gate'),history=document.querySelector('#history');
function node(tag,content,cls){const n=document.createElement(tag);n.textContent=content;if(cls)n.className=cls;return n;}
try{
 const response=await fetch('../examples/product-page/scenario.json');if(!response.ok)throw new Error('JSON HTTP '+response.status);
 const {snapshots}=await response.json();
 function render(index){const {label,run}=snapshots[index];tabs.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
  summary.textContent=label+' · '+run.runId+' · 상태: '+run.state;
  tasks.replaceChildren();for(const t of run.tasks){const card=node('article','', 'card');card.append(node('h2',t.taskId+' · '+t.objective),node('div','책임: '+t.ownerId+' · 선행: '+(t.dependsOn.join(', ')||'없음'),'meta'));
   const latest=run.reviews.filter(r=>r.taskId===t.taskId&&r.artifactVersion===t.artifact?.version).sort((a,b)=>String(a.reviewedAt).localeCompare(String(b.reviewedAt))).at(-1);
   const dependenciesCurrent=t.dependsOn.every(id=>{const upstream=run.tasks.find(x=>x.taskId===id);return upstream?.state==='accepted'&&t.inputVersions?.[id]===upstream.artifact?.version});
   const review=dependenciesCurrent&&latest?.decision==='pass'&&latest.reviewerId!==t.ownerId&&latest.evidenceRefs?.length&&t.acceptanceCriteria.every(c=>latest.criteriaResults?.some(x=>x.criterion===c&&x.pass&&x.evidenceRef))?latest:null;
   const label=t.state==='accepted'&&review?'검수 통과':t.state==='stale'?'무효화/재검토':t.state==='working'?'실행 중':t.state==='planned'?'선행 대기':t.state;
   card.append(node('span',label,'badge '+(review&&t.state==='accepted'?'pass':t.state==='stale'?'stale':t.state==='working'?'warn':'')));
   card.append(node('p','산출물: '+(t.artifact?.version||'미제출')+' · 검수: '+(review?.reviewId||'현재 통과 근거 없음')));
   const ex=run.executions.filter(e=>e.taskId===t.taskId);if(ex.length)card.append(node('p','임시 실행: '+ex.map(e=>e.childSessionKey+' ('+e.state+')').join(', ')));
   tasks.append(card);
  }
  gate.textContent=run.integration?.decision==='pass'?'총괄 통합: '+run.integration.integrationId+' · 사용자 게시 승인 대기 · 실제 전달 없음':'총괄 통합: 미완료 · 승인/실제 전달 없음';
  history.replaceChildren(...(run.history||[]).map(event=>node('li',event.type+' · '+(event.ref||event.refs?.join(', ')||''))));
 }
 snapshots.forEach((s,i)=>{const b=node('button',s.label);b.type='button';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>render(i));tabs.append(b);});render(0);
}catch(error){summary.textContent='예제 JSON을 읽지 못했습니다: '+error.message;}
</script></body></html>
